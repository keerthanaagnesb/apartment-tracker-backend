spring.application.name=Apartment Community Issue Tracker - Backend API


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/apartment_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sroot}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.sql.init.mode=never


app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789-abcdef}
app.jwt.expiration-hours=8

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

server.port=${PORT:8080}
