spring.application.name=Apartment Community Issue Tracker - Backend API

# ---- MySQL (values come from environment variables, so no password is ever committed to git) ----
#   DB_URL      e.g. jdbc:mysql://<host>:<port>/<database>?sslMode=REQUIRED   (Aiven)
#               or   jdbc:mysql://localhost:3306/apartment_tracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
#   DB_USERNAME e.g. avnadmin / root
#   DB_PASSWORD your database password
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/apartment_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sroot}
# Tables are created/updated automatically (or run database/schema.sql yourself first).
# Demo accounts are added by DataSeeder.java when the users table is empty.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.sql.init.mode=never

# ---- JWT login tokens ----
# Set JWT_SECRET to your own long random string (32+ characters) outside of development.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789-abcdef}
app.jwt.expiration-hours=8

# ---- Which frontend origins may call this API (comma separated; * wildcards allowed for ports) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://24EG107H46.netfify.app}

server.port=${PORT:8080}
